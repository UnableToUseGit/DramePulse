<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DramePulse 高光标注工具</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        color-scheme: dark;
        --bg: #111315;
        --panel: #1b1f22;
        --panel-soft: #23292d;
        --line: #374047;
        --text: #f2f0e8;
        --muted: #a8b0b4;
        --soft: #cfd6d9;
        --accent: #f6c85f;
        --accent-2: #58d5c9;
        --danger: #ff7c6e;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        height: 100%;
        min-height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(246, 200, 95, 0.06), transparent 280px),
          var(--bg);
        color: var(--text);
        font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 9px 12px;
        background: var(--panel-soft);
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button.primary {
        background: var(--accent);
        color: #1b1609;
        font-weight: 700;
      }

      button.ghost {
        background: transparent;
        border-color: var(--line);
      }

      button.danger {
        color: var(--danger);
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 18px;
        height: 100vh;
        min-height: 0;
        overflow: hidden;
        padding: 18px;
      }

      .workspace,
      .danmaku-panel,
      .form-panel,
      .list-panel {
        background: rgba(27, 31, 34, 0.96);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .workspace {
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
        gap: 14px;
        overflow-y: auto;
        overscroll-behavior: contain;
        min-width: 0;
        min-height: 0;
        padding: 14px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .brand p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .video-picker {
        min-width: 220px;
      }

      .time-readout {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        background: #131719;
      }

      .time-readout strong {
        font-variant-numeric: tabular-nums;
        font-size: 22px;
      }

      .time-readout span {
        color: var(--muted);
        font-size: 12px;
      }

      .video-frame {
        position: relative;
        overflow: visible;
        background: #050607;
        border: 1px solid #050607;
      }

      video {
        display: block;
        width: 100%;
        height: auto;
        max-height: 46vh;
        background: #000;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .form-panel {
        padding: 14px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #111618;
        color: var(--text);
        padding: 9px 10px;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent-2);
      }

      textarea {
        min-height: 82px;
        resize: vertical;
      }

      .reason-field {
        grid-column: 1 / -1;
      }

      .form-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .list-panel {
        overflow: hidden;
      }

      .list-head,
      .danmaku-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .list-head h2,
      .danmaku-head h2 {
        margin: 0;
        font-size: 15px;
      }

      .annotation-list {
        display: grid;
        gap: 8px;
        max-height: 28vh;
        overflow: auto;
        padding: 10px;
      }

      .annotation-item {
        display: grid;
        gap: 6px;
        padding: 10px;
        border: 1px solid var(--line);
        background: #14191b;
      }

      .annotation-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--soft);
        font-size: 13px;
      }

      .annotation-reason {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .side {
        display: grid;
        min-height: 0;
        overflow: hidden;
      }

      .danmaku-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .status-pill {
        border: 1px solid var(--line);
        color: var(--muted);
        padding: 4px 8px;
        font-size: 12px;
      }

      .danmaku-list {
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        scroll-behavior: smooth;
        padding: 8px;
      }

      .danmaku-row {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr);
        gap: 8px;
        padding: 8px;
        border-left: 3px solid transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .danmaku-row:hover {
        background: #20262a;
        color: var(--text);
      }

      .danmaku-row.active {
        border-left-color: var(--accent);
        background: rgba(246, 200, 95, 0.12);
        color: var(--text);
      }

      .danmaku-time {
        color: var(--accent-2);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }

      .danmaku-text {
        min-width: 0;
        line-height: 1.35;
      }

      .danmaku-score {
        grid-column: 2;
        color: #7f898e;
        font-size: 11px;
      }

      .empty {
        color: var(--muted);
        padding: 16px;
      }

      @media (max-width: 980px) {
        html,
        body {
          height: auto;
          overflow: auto;
        }

        .app {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }

        .side {
          height: min(520px, 70vh);
          min-height: 420px;
        }

        .form-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="workspace">
        <header class="topbar">
          <div class="brand">
            <h1>DramePulse 高光标注</h1>
            <p id="videoMeta">加载视频列表中 · 标注字段：cue_time、primary_expression、reason</p>
          </div>
          <select id="videoPicker" class="video-picker" aria-label="选择标注视频" disabled>
            <option value="">加载中</option>
          </select>
          <div class="time-readout" aria-live="polite">
            <strong id="currentTime">00:00.000</strong>
            <span>current</span>
          </div>
        </header>

        <section class="video-frame">
          <video id="video" controls preload="metadata"></video>
        </section>

        <section class="form-panel" aria-label="高光标注表单">
          <div class="controls">
            <button id="markCue" type="button">标记当前时间</button>
            <button id="jumpCue" type="button" class="ghost">跳到标记</button>
            <button id="exportJson" type="button" class="primary">导出 JSON</button>
          </div>

          <div class="form-grid" style="margin-top: 12px;">
            <label>
              cue_time
              <input id="cueTime" inputmode="decimal" placeholder="0.000">
            </label>
            <label>
              primary_expression
              <select id="primaryExpression">
                <option value="爽到了">爽到了</option>
                <option value="震惊">震惊</option>
                <option value="磕到了">磕到了</option>
                <option value="看哭了">看哭了</option>
                <option value="燃起来了">燃起来了</option>
                <option value="笑死">笑死</option>
              </select>
            </label>
            <label>
              操作
              <button id="addAnnotation" type="button" class="primary">添加标注</button>
            </label>
            <label class="reason-field">
              reason
              <textarea id="reason" placeholder="说明为什么这里值得互动，可引用剧情和弹幕共鸣证据。"></textarea>
            </label>
          </div>
        </section>

        <section class="list-panel" aria-label="已标注列表">
          <div class="list-head">
            <h2>已标注高光</h2>
            <span class="status-pill" id="annotationCount">0 条</span>
          </div>
          <div id="annotationList" class="annotation-list">
            <div class="empty">还没有标注。播放视频，结合右侧弹幕时间轴选择高光点。</div>
          </div>
        </section>
      </section>

      <aside class="side">
        <section class="danmaku-panel" aria-label="弹幕时间轴">
          <div class="danmaku-head">
            <h2>弹幕时间轴</h2>
            <span class="status-pill" id="danmakuStatus">加载中</span>
          </div>
          <div id="danmakuList" class="danmaku-list"></div>
        </section>
      </aside>
    </main>

    <script src="./annotation_tool.js"></script>
    <script>
      const config = AnnotationTool.readAnnotationConfig(window.location.href);
      const video = document.getElementById("video");
      const videoMetaEl = document.getElementById("videoMeta");
      const videoPickerEl = document.getElementById("videoPicker");
      const currentTimeEl = document.getElementById("currentTime");
      const cueTimeInput = document.getElementById("cueTime");
      const primaryExpressionInput = document.getElementById("primaryExpression");
      const reasonInput = document.getElementById("reason");
      const danmakuListEl = document.getElementById("danmakuList");
      const danmakuStatusEl = document.getElementById("danmakuStatus");
      const annotationListEl = document.getElementById("annotationList");
      const annotationCountEl = document.getElementById("annotationCount");

      let danmakuItems = [];
      let activeDanmakuIndex = -1;
      let annotations = [];
      let videoContext = null;
      let stateEpisodes = [];

      function setCurrentTime(value) {
        video.currentTime = Math.max(0, Number(value) || 0);
      }

      function renderDanmaku(items) {
        danmakuListEl.textContent = "";
        if (!items.length) {
          danmakuListEl.innerHTML = '<div class="empty">未读取到弹幕。</div>';
          return;
        }
        const fragment = document.createDocumentFragment();
        items.forEach((item, index) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "danmaku-row";
          row.dataset.index = String(index);
          row.innerHTML = `
            <span class="danmaku-time">${AnnotationTool.formatClock(item.time_sec)}</span>
            <span class="danmaku-text"></span>
            <span class="danmaku-score">digg ${item.digg_count} · score ${item.score.toFixed(1)}</span>
          `;
          row.querySelector(".danmaku-text").textContent = item.text;
          row.addEventListener("click", () => {
            setCurrentTime(item.time_sec);
            video.pause();
            updateTimeState();
          });
          fragment.appendChild(row);
        });
        danmakuListEl.appendChild(fragment);
      }

      function renderVideoPicker(videos, selectedVideoId) {
        videoPickerEl.textContent = "";
        videos.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.video_id;
          option.textContent = item.episode_label ? `${item.episode_label} · ${item.title}` : item.title;
          videoPickerEl.appendChild(option);
        });
        videoPickerEl.value = selectedVideoId;
        videoPickerEl.disabled = videos.length <= 1;
      }

      function setVideoContext(context) {
        videoContext = context;
        annotations = [];
        danmakuItems = [];
        activeDanmakuIndex = -1;
        video.src = context.videoPath;
        video.load();
        const parts = [context.videoId];
        if (context.seriesName) parts.push(context.seriesName);
        if (context.episodeLabel) parts.push(context.episodeLabel);
        if (context.title && context.title !== context.videoId) parts.push(context.title);
        videoMetaEl.textContent = `${parts.join(" · ")} · 标注字段：cue_time、primary_expression、reason`;
        currentTimeEl.textContent = AnnotationTool.formatClock(0);
        renderAnnotations();
      }

      function updateActiveDanmaku() {
        const nextIndex = AnnotationTool.findActiveDanmakuIndex(danmakuItems, video.currentTime);
        if (nextIndex === activeDanmakuIndex) return;
        const previous = danmakuListEl.querySelector(`.danmaku-row[data-index="${activeDanmakuIndex}"]`);
        if (previous) previous.classList.remove("active");
        activeDanmakuIndex = nextIndex;
        const current = danmakuListEl.querySelector(`.danmaku-row[data-index="${activeDanmakuIndex}"]`);
        if (current) {
          current.classList.add("active");
          if (!video.paused) {
            const targetTop = current.offsetTop - danmakuListEl.clientHeight / 2 + current.offsetHeight / 2;
            danmakuListEl.scrollTo({
              top: Math.max(0, targetTop),
              behavior: "smooth",
            });
          }
        }
      }

      function updateTimeState() {
        currentTimeEl.textContent = AnnotationTool.formatClock(video.currentTime);
        updateActiveDanmaku();
      }

      function renderAnnotations() {
        annotationCountEl.textContent = `${annotations.length} 条`;
        annotationListEl.textContent = "";
        if (!annotations.length) {
          annotationListEl.innerHTML = '<div class="empty">还没有标注。播放视频，结合右侧弹幕时间轴选择高光点。</div>';
          return;
        }
        annotations.forEach((annotation, index) => {
          const item = document.createElement("article");
          item.className = "annotation-item";
          item.innerHTML = `
            <div class="annotation-meta">
              <strong>${AnnotationTool.formatClock(annotation.cue_time)}</strong>
              <span>${annotation.primary_expression}</span>
            </div>
            <p class="annotation-reason"></p>
            <div>
              <button type="button" class="ghost">跳转</button>
              <button type="button" class="ghost danger">删除</button>
            </div>
          `;
          item.querySelector(".annotation-reason").textContent = annotation.reason;
          const buttons = item.querySelectorAll("button");
          buttons[0].addEventListener("click", () => setCurrentTime(annotation.cue_time));
          buttons[1].addEventListener("click", () => {
            annotations.splice(index, 1);
            renderAnnotations();
          });
          annotationListEl.appendChild(item);
        });
      }

      function addAnnotation() {
        const cueTime = AnnotationTool.roundTime(cueTimeInput.value);
        const primaryExpression = primaryExpressionInput.value.trim();
        const reason = reasonInput.value.trim();
        if (!Number.isFinite(Number(cueTimeInput.value)) || cueTime < 0) {
          alert("cue_time 必须是非负数字。");
          return;
        }
        if (!primaryExpression || !reason) {
          alert("primary_expression 和 reason 不能为空。");
          return;
        }
        annotations.push({
          cue_time: cueTime,
          primary_expression: primaryExpression,
          reason,
        });
        annotations.sort((a, b) => a.cue_time - b.cue_time);
        reasonInput.value = "";
        renderAnnotations();
      }

      function exportJson() {
        if (!videoContext) {
          alert("视频信息尚未加载完成。");
          return;
        }
        const payload = AnnotationTool.buildAnnotationPayload({
          videoId: videoContext.videoId,
          videoPath: videoContext.videoPath,
          subtitlePath: videoContext.subtitlePath,
          sourceJsonPath: videoContext.sourceJsonPath,
          annotations,
        });
        const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], {
          type: "application/json;charset=utf-8",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${videoContext.videoId}.annotation.json`;
        document.body.appendChild(link);
        link.click();
        setTimeout(() => {
          URL.revokeObjectURL(link.href);
          link.remove();
        }, 1000);
      }

      async function loadDanmaku(context) {
        try {
          if (!context.sourceJsonPath) throw new Error("danmaku_url is empty");
          const response = await fetch(context.sourceJsonPath);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          danmakuItems = AnnotationTool.normalizeDanmaku(payload.items || payload.danmaku);
          renderDanmaku(danmakuItems);
          danmakuStatusEl.textContent = `${danmakuItems.length} 条`;
          updateActiveDanmaku();
        } catch (error) {
          danmakuStatusEl.textContent = "加载失败";
          danmakuListEl.innerHTML = '<div class="empty">无法从后端服务读取弹幕。请确认 API 服务已启动，且视频包含 danmaku_url。</div>';
        }
      }

      async function fetchJson(path) {
        const response = await fetch(AnnotationTool.buildApiUrl(config.apiBaseUrl, path));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      }

      async function loadVideoById(videoId) {
        danmakuStatusEl.textContent = "加载中";
        danmakuListEl.innerHTML = '<div class="empty">正在从后端服务读取弹幕。</div>';
        const videoPayload = stateEpisodes.find((item) => item.video_id === videoId);
        if (!videoPayload) throw new Error(`Episode not found: ${videoId}`);
        const context = AnnotationTool.normalizeVideoContext(videoPayload, config);
        setVideoContext(context);
        await loadDanmaku(context);
      }

      async function loadInitialVideo() {
        try {
          const listPayload = await fetchJson("/api/episodes");
          const videos = AnnotationTool.normalizeVideoList(listPayload);
          stateEpisodes = videos;
          const selected = AnnotationTool.selectInitialVideo(videos, config.videoId);
          if (!selected) throw new Error(config.videoId ? `Video not found: ${config.videoId}` : "No videos available");
          renderVideoPicker(videos, selected.video_id);
          await loadVideoById(selected.video_id);
        } catch (error) {
          videoMetaEl.textContent = "视频加载失败 · 请确认后端 API 服务已启动";
          videoPickerEl.textContent = "";
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "加载失败";
          videoPickerEl.appendChild(option);
          videoPickerEl.disabled = true;
          danmakuStatusEl.textContent = "加载失败";
          danmakuListEl.innerHTML = '<div class="empty">无法读取 /api/episodes。请通过 scripts/serve_algorithm_review_tool.py 启动本地数据服务。</div>';
        }
      }

      document.getElementById("markCue").addEventListener("click", () => {
        cueTimeInput.value = AnnotationTool.roundTime(video.currentTime).toFixed(3);
      });
      document.getElementById("jumpCue").addEventListener("click", () => setCurrentTime(cueTimeInput.value));
      document.getElementById("addAnnotation").addEventListener("click", addAnnotation);
      document.getElementById("exportJson").addEventListener("click", exportJson);
      videoPickerEl.addEventListener("change", () => {
        if (videoPickerEl.value) {
          loadVideoById(videoPickerEl.value);
        }
      });
      video.addEventListener("timeupdate", updateTimeState);
      video.addEventListener("seeked", updateTimeState);
      video.addEventListener("play", updateTimeState);
      video.addEventListener("pause", updateTimeState);

      renderAnnotations();
      loadInitialVideo();
    </script>
  </body>
</html>
