<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DramePulse Trigger 对照台</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --panel: #181c1f;
        --panel-soft: #20262a;
        --line: #323a40;
        --text: #f3efe6;
        --muted: #a7b0b5;
        --accent: #f0c35a;
        --cyan: #59c7c0;
        --red: #ff776b;
        --green: #7bd88f;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      button, select { font: inherit; }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-soft);
        color: var(--text);
        padding: 8px 10px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(520px, 46vw);
        gap: 14px;
        height: 100vh;
        padding: 14px;
      }
      .main, .side {
        min-height: 0;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        gap: 12px;
        padding: 12px;
      }
      .topbar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 10px;
        align-items: center;
      }
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #111619;
        color: var(--text);
        padding: 8px 10px;
      }
      .status {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .video-wrap {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 0;
        overflow: hidden;
        background: #050607;
        border: 1px solid #050607;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .subtitle-line {
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border: 1px solid var(--line);
        background: #13181b;
        color: #fff5cf;
        text-align: center;
        font-size: 18px;
      }
      .timeline {
        position: relative;
        height: 54px;
        border: 1px solid var(--line);
        background: #111619;
        overflow: hidden;
      }
      .marker {
        position: absolute;
        top: 8px;
        width: 10px;
        height: 34px;
        transform: translateX(-5px);
        border-radius: 4px;
        border: 1px solid #000;
        background: var(--accent);
        cursor: pointer;
      }
      .marker.gold {
        top: 3px;
        height: 44px;
        background: var(--green);
      }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--red);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .side {
        display: grid;
        grid-template-rows: minmax(0, 1fr) minmax(190px, .45fr);
        gap: 10px;
        padding: 12px;
      }
      .comparison-grid {
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .column {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 8px;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .trigger-list {
        overflow: auto;
        display: grid;
        align-content: start;
        gap: 8px;
        padding-right: 4px;
      }
      .trigger-item {
        border: 1px solid var(--line);
        background: #14191c;
        padding: 10px;
        display: grid;
        gap: 6px;
        cursor: pointer;
      }
      .trigger-item.active { border-color: var(--accent); }
      .trigger-item.gold { border-left: 4px solid var(--green); }
      .trigger-item.prediction { border-left: 4px solid var(--accent); }
      .time { font-variant-numeric: tabular-nums; color: var(--accent); }
      .trigger-item.gold .time { color: var(--green); }
      .meta { color: var(--muted); font-size: 12px; }
      .trigger-reason {
        color: #d8dde0;
        font-size: 13px;
        line-height: 1.45;
      }
      .detail {
        overflow: auto;
        border: 1px solid var(--line);
        background: #14191c;
        padding: 12px;
      }
      .detail h2 { margin: 0 0 8px; font-size: 18px; }
      .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 10px 0;
      }
      .kv {
        border: 1px solid var(--line);
        background: #111619;
        padding: 8px;
      }
      .kv span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 3px;
      }
      @media (max-width: 980px) {
        html, body { overflow: auto; }
        .app { height: auto; grid-template-columns: 1fr; }
        .main { min-height: 720px; }
        .side { min-height: 760px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="main">
        <div class="topbar">
          <select id="episodeSelect"></select>
          <div class="status" id="reviewProgress">未加载</div>
        </div>
        <div class="video-wrap">
          <video id="video" controls playsinline></video>
        </div>
        <div class="subtitle-line" id="subtitleLine">选择剧集后开始对照</div>
        <div class="timeline" id="timeline"><div class="playhead" id="playhead"></div></div>
        <div class="actions">
          <button id="prevTrigger">上一项</button>
          <button id="nextTrigger">下一项</button>
        </div>
      </section>
      <aside class="side">
        <div class="comparison-grid">
          <div class="column">
            <div class="section-title"><strong>Groundtruth</strong><span id="groundtruthCount">0</span></div>
            <div class="trigger-list" id="groundtruthList"></div>
          </div>
          <div class="column">
            <div class="section-title"><strong>Prediction</strong><span id="predictionCount">0</span></div>
            <div class="trigger-list" id="predictionList"></div>
          </div>
        </div>
        <div class="detail" id="detailPanel"></div>
      </aside>
    </main>
    <script src="/review_tool.js"></script>
    <script>
      const state = {
        episodes: [],
        currentEpisode: null,
        reviewItems: [],
        goldAnnotations: [],
        subtitles: [],
        selectedKey: "",
        selectedKind: "",
        duration: 0,
      };

      const el = {
        episodeSelect: document.getElementById("episodeSelect"),
        reviewProgress: document.getElementById("reviewProgress"),
        video: document.getElementById("video"),
        subtitleLine: document.getElementById("subtitleLine"),
        timeline: document.getElementById("timeline"),
        playhead: document.getElementById("playhead"),
        prevTrigger: document.getElementById("prevTrigger"),
        nextTrigger: document.getElementById("nextTrigger"),
        groundtruthList: document.getElementById("groundtruthList"),
        groundtruthCount: document.getElementById("groundtruthCount"),
        predictionList: document.getElementById("predictionList"),
        predictionCount: document.getElementById("predictionCount"),
        detailPanel: document.getElementById("detailPanel"),
      };

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`${url}: ${response.status}`);
        return response.json();
      }

      async function loadEpisodes() {
        const index = await fetchJson("/api/episodes");
        state.episodes = index.episodes || [];
        el.episodeSelect.innerHTML = state.episodes.map((episode) => {
          const label = `${episode.series_id}/${episode.episode_id} · gt ${episode.gold_annotation_count || 0} · pred ${episode.algorithm_output_type || "none"}`;
          return `<option value="${episode.video_id}">${label}</option>`;
        }).join("");
        if (state.episodes.length) await loadEpisode(state.episodes[0].video_id);
      }

      async function loadEpisode(videoId) {
        const episode = state.episodes.find((item) => item.video_id === videoId);
        if (!episode) return;
        state.currentEpisode = episode;
        state.selectedKey = "";
        state.selectedKind = "";
        state.duration = 0;
        el.video.src = `/api/episodes/${videoId}/video`;
        const [algorithmOutput, subtitleText, goldPayload] = await Promise.all([
          fetchJson(`/api/episodes/${videoId}/algorithm-output`),
          fetch(`/api/episodes/${videoId}/subtitle`).then((response) => response.ok ? response.text() : ""),
          fetchJson(`/api/episodes/${videoId}/gold-annotations`),
        ]);
        state.reviewItems = ReviewTool.normalizeAlgorithmOutput(algorithmOutput, videoId);
        state.goldAnnotations = ReviewTool.normalizeGoldAnnotations(goldPayload, videoId);
        state.subtitles = parseSrt(subtitleText);
        const first = state.goldAnnotations[0] || state.reviewItems[0];
        if (first) {
          state.selectedKey = first.id;
          state.selectedKind = first.kind;
        }
        renderAll();
      }

      function parseSrt(text) {
        return String(text || "").split(/\n\s*\n/).map((block) => {
          const lines = block.trim().split(/\n/);
          const timeLine = lines.find((line) => line.includes("-->")) || "";
          const match = timeLine.match(/(\d+):(\d+):(\d+),(\d+)\s+-->\s+(\d+):(\d+):(\d+),(\d+)/);
          if (!match) return null;
          const start = Number(match[1]) * 3600 + Number(match[2]) * 60 + Number(match[3]) + Number(match[4]) / 1000;
          const end = Number(match[5]) * 3600 + Number(match[6]) * 60 + Number(match[7]) + Number(match[8]) / 1000;
          return { start, end, text: lines.slice(lines.indexOf(timeLine) + 1).join(" ") };
        }).filter(Boolean);
      }

      function renderAll() {
        renderProgress();
        renderTimeline();
        renderComparisonLists();
        renderSelectedDetail();
        updateSubtitle();
      }

      function renderProgress() {
        el.reviewProgress.textContent = `gt ${state.goldAnnotations.length} · pred ${state.reviewItems.length}`;
      }

      function renderComparisonLists() {
        el.groundtruthCount.textContent = String(state.goldAnnotations.length);
        el.predictionCount.textContent = String(state.reviewItems.length);
        el.groundtruthList.innerHTML = state.goldAnnotations.map((item) => renderListItem(item, "gold")).join("") || '<div class="meta">没有 groundtruth 标注。</div>';
        el.predictionList.innerHTML = state.reviewItems.map((item) => renderListItem(item, "prediction")).join("") || '<div class="meta">没有 prediction 结果。</div>';
      }

      function renderListItem(item, column) {
        const active = item.id === state.selectedKey && item.kind === state.selectedKind ? "active" : "";
        return `<div class="trigger-item ${column} ${active}" data-kind="${item.kind}" data-id="${item.id}">
          <div><span class="time">${ReviewTool.formatClock(item.cue_time)}</span> ${escapeHtml(item.primary_expression || item.kind)}</div>
          <div class="meta">${escapeHtml(item.source_type || item.kind)}${item.confidence ? ` · conf ${item.confidence.toFixed(2)}` : ""}</div>
          <div class="trigger-reason">${escapeHtml(item.summary || item.reason || "无摘要")}</div>
        </div>`;
      }

      function renderTimeline() {
        const width = Math.max(1, el.timeline.clientWidth);
        const duration = state.duration || el.video.duration || Math.max(...state.reviewItems.map((item) => item.end_time), ...state.goldAnnotations.map((item) => item.cue_time), 1);
        el.timeline.querySelectorAll(".marker").forEach((node) => node.remove());
        for (const item of state.goldAnnotations) {
          const marker = document.createElement("div");
          marker.className = "marker gold";
          marker.title = `${ReviewTool.formatClock(item.cue_time)} GT: ${item.primary_expression}`;
          marker.style.left = `${Math.min(1, item.cue_time / duration) * width}px`;
          marker.dataset.kind = item.kind;
          marker.dataset.id = item.id;
          el.timeline.appendChild(marker);
        }
        for (const item of state.reviewItems) {
          const marker = document.createElement("div");
          marker.className = "marker";
          marker.title = `${ReviewTool.formatClock(item.cue_time)} Pred: ${item.primary_expression || item.kind}`;
          marker.style.left = `${Math.min(1, item.cue_time / duration) * width}px`;
          marker.dataset.kind = item.kind;
          marker.dataset.id = item.id;
          el.timeline.appendChild(marker);
        }
        updatePlayhead();
      }

      function selectedItem() {
        return [...state.goldAnnotations, ...state.reviewItems].find((item) => item.id === state.selectedKey && item.kind === state.selectedKind) || null;
      }

      function renderSelectedDetail() {
        const item = selectedItem();
        if (!item) {
          el.detailPanel.innerHTML = '<h2>未选择</h2><p class="meta">点击 Groundtruth 或 Prediction 查看详情。</p>';
          return;
        }
        const windowText = item.payoff_window
          ? `${ReviewTool.formatClock(item.payoff_window.start_time)} - ${ReviewTool.formatClock(item.payoff_window.end_time)}`
          : "无";
        el.detailPanel.innerHTML = `
          <h2>${escapeHtml(item.primary_expression || item.kind)}</h2>
          <div class="meta">${item.kind} · ${escapeHtml(item.id)}</div>
          <div class="detail-grid">
            <div class="kv"><span>cue_time</span>${ReviewTool.formatClock(item.cue_time)}</div>
            <div class="kv"><span>interval</span>${ReviewTool.formatClock(item.start_time)} - ${ReviewTool.formatClock(item.end_time)}</div>
            <div class="kv"><span>confidence</span>${item.confidence ? item.confidence.toFixed(3) : "n/a"}</div>
            <div class="kv"><span>gold window</span>${windowText}</div>
          </div>
          <p>${escapeHtml(item.summary || "无摘要")}</p>
          <p class="trigger-reason">原因：${escapeHtml(item.reason || "无原因")}</p>
        `;
      }

      function selectAndJump(kind, id) {
        const item = [...state.goldAnnotations, ...state.reviewItems].find((candidate) => candidate.kind === kind && candidate.id === id);
        if (!item) return;
        state.selectedKind = kind;
        state.selectedKey = id;
        el.video.currentTime = Math.max(0, item.cue_time - 1);
        renderAll();
      }

      function orderedItems() {
        return [...state.goldAnnotations, ...state.reviewItems].sort((a, b) => a.cue_time - b.cue_time || a.kind.localeCompare(b.kind));
      }

      function selectedIndex() {
        return orderedItems().findIndex((item) => item.id === state.selectedKey && item.kind === state.selectedKind);
      }

      function moveSelection(delta) {
        const items = orderedItems();
        if (!items.length) return;
        const current = selectedIndex();
        const next = Math.max(0, Math.min(items.length - 1, current + delta));
        selectAndJump(items[next].kind, items[next].id);
      }

      function updateSubtitle() {
        const current = el.video.currentTime || 0;
        const active = state.subtitles.find((item) => item.start <= current && current <= item.end);
        el.subtitleLine.textContent = active ? active.text : " ";
      }

      function updatePlayhead() {
        const duration = state.duration || el.video.duration || 1;
        el.playhead.style.left = `${Math.min(1, (el.video.currentTime || 0) / duration) * 100}%`;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      }

      el.episodeSelect.addEventListener("change", () => loadEpisode(el.episodeSelect.value));
      el.groundtruthList.addEventListener("click", (event) => {
        const node = event.target.closest("[data-id]");
        if (node) selectAndJump(node.dataset.kind, node.dataset.id);
      });
      el.predictionList.addEventListener("click", (event) => {
        const node = event.target.closest("[data-id]");
        if (node) selectAndJump(node.dataset.kind, node.dataset.id);
      });
      el.timeline.addEventListener("click", (event) => {
        const marker = event.target.closest("[data-id]");
        if (marker) selectAndJump(marker.dataset.kind, marker.dataset.id);
      });
      el.prevTrigger.addEventListener("click", () => moveSelection(-1));
      el.nextTrigger.addEventListener("click", () => moveSelection(1));
      el.video.addEventListener("loadedmetadata", () => {
        state.duration = el.video.duration || 0;
        renderTimeline();
      });
      el.video.addEventListener("timeupdate", () => {
        updateSubtitle();
        updatePlayhead();
      });
      window.addEventListener("resize", renderTimeline);

      loadEpisodes().catch((error) => {
        el.subtitleLine.textContent = `加载失败: ${error.message}`;
      });
    </script>
  </body>
</html>
