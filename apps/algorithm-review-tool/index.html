<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DramePulse 算法验证台</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --panel: #181c1f;
        --panel-soft: #20262a;
        --line: #323a40;
        --text: #f3efe6;
        --muted: #a7b0b5;
        --accent: #f0c35a;
        --cyan: #59c7c0;
        --red: #ff776b;
        --green: #7bd88f;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      button, input, select, textarea { font: inherit; }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-soft);
        color: var(--text);
        padding: 8px 10px;
        cursor: pointer;
      }
      button:hover, button.active { border-color: var(--accent); }
      button.primary { background: var(--accent); color: #171204; font-weight: 800; }
      button.good.active { border-color: var(--green); color: var(--green); }
      button.bad.active { border-color: var(--red); color: var(--red); }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #111619;
        color: var(--text);
        padding: 8px 10px;
      }
      textarea { min-height: 82px; resize: vertical; }
      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 14px;
        height: 100vh;
        padding: 14px;
      }
      .main, .side, .panel {
        min-height: 0;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        gap: 12px;
        padding: 12px;
      }
      .topbar {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto auto;
        gap: 10px;
        align-items: center;
      }
      .status {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .video-wrap {
        display: grid;
        place-items: center;
        min-height: 0;
        background: #050607;
        border: 1px solid #050607;
      }
      video {
        display: block;
        width: auto;
        height: 100%;
        max-width: 100%;
        background: #000;
      }
      .subtitle-line {
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border: 1px solid var(--line);
        background: #13181b;
        color: #fff5cf;
        text-align: center;
        font-size: 18px;
      }
      .timeline {
        position: relative;
        height: 54px;
        border: 1px solid var(--line);
        background: #111619;
        overflow: hidden;
      }
      .marker {
        position: absolute;
        top: 8px;
        width: 10px;
        height: 34px;
        transform: translateX(-5px);
        border-radius: 4px;
        border: 1px solid #000;
        background: var(--accent);
        cursor: pointer;
      }
      .marker.missed { background: var(--cyan); }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--red);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .side {
        display: grid;
        grid-template-rows: auto minmax(0, .85fr) minmax(0, 1.15fr);
        gap: 10px;
        padding: 12px;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .trigger-list, .danmaku-list {
        overflow: auto;
        display: grid;
        gap: 8px;
        padding-right: 4px;
      }
      .trigger-item {
        border: 1px solid var(--line);
        background: #14191c;
        padding: 10px;
        display: grid;
        gap: 6px;
        cursor: pointer;
      }
      .trigger-item.active { border-color: var(--accent); }
      .trigger-item.reviewed { border-left: 4px solid var(--green); }
      .time { font-variant-numeric: tabular-nums; color: var(--accent); }
      .meta { color: var(--muted); font-size: 12px; }
      .detail {
        overflow: auto;
        border: 1px solid var(--line);
        background: #14191c;
        padding: 12px;
      }
      .detail h2 { margin: 0 0 8px; font-size: 18px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .full { grid-column: 1 / -1; }
      .verdicts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
      .danmaku-row {
        border-left: 2px solid var(--line);
        padding: 5px 8px;
        color: var(--muted);
        font-size: 13px;
      }
      .danmaku-row.near { border-left-color: var(--cyan); color: var(--text); }
      @media (max-width: 980px) {
        html, body { overflow: auto; }
        .app { height: auto; grid-template-columns: 1fr; }
        .main { min-height: 720px; }
        .side { min-height: 760px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="main">
        <div class="topbar">
          <select id="episodeSelect"></select>
          <div class="status" id="reviewProgress">未加载</div>
          <button class="primary" id="saveFeedback">保存反馈</button>
        </div>
        <div class="video-wrap">
          <video id="video" controls playsinline></video>
        </div>
        <div class="subtitle-line" id="subtitleLine">选择剧集后开始审阅</div>
        <div class="timeline" id="timeline"><div class="playhead" id="playhead"></div></div>
        <div class="actions">
          <button id="prevTrigger">上一触发点</button>
          <button id="nextTrigger">下一触发点</button>
          <button id="addMissed">当前时间新增漏检</button>
          <span class="status" id="saveStatus">未保存</span>
        </div>
      </section>
      <aside class="side">
        <div>
          <div class="section-title">
            <strong>算法触发点</strong>
            <select id="filterSelect">
              <option value="all">全部</option>
              <option value="pending">待审核</option>
              <option value="reviewed">已审核</option>
            </select>
          </div>
          <div class="trigger-list" id="triggerList"></div>
        </div>
        <div>
          <div class="section-title"><strong>附近弹幕</strong><span id="danmakuCount">0</span></div>
          <div class="danmaku-list" id="danmakuList"></div>
        </div>
        <div class="detail" id="detailPanel"></div>
      </aside>
    </main>
    <script src="/review_tool.js"></script>
    <script>
      const state = {
        episodes: [],
        currentEpisode: null,
        reviewItems: [],
        subtitles: [],
        danmaku: [],
        reviews: {},
        missedTriggers: [],
        selectedId: "",
        duration: 0,
      };

      const el = {
        episodeSelect: document.getElementById("episodeSelect"),
        reviewProgress: document.getElementById("reviewProgress"),
        saveFeedback: document.getElementById("saveFeedback"),
        video: document.getElementById("video"),
        subtitleLine: document.getElementById("subtitleLine"),
        timeline: document.getElementById("timeline"),
        playhead: document.getElementById("playhead"),
        prevTrigger: document.getElementById("prevTrigger"),
        nextTrigger: document.getElementById("nextTrigger"),
        addMissed: document.getElementById("addMissed"),
        saveStatus: document.getElementById("saveStatus"),
        filterSelect: document.getElementById("filterSelect"),
        triggerList: document.getElementById("triggerList"),
        danmakuList: document.getElementById("danmakuList"),
        danmakuCount: document.getElementById("danmakuCount"),
        detailPanel: document.getElementById("detailPanel"),
      };

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`${url}: ${response.status}`);
        return response.json();
      }

      async function loadEpisodes() {
        const index = await fetchJson("/api/episodes");
        state.episodes = index.episodes || [];
        el.episodeSelect.innerHTML = state.episodes.map((episode) => {
          const label = `${episode.series_id}/${episode.episode_id} · ${episode.algorithm_output_type || "无算法输出"}`;
          return `<option value="${episode.video_id}">${label}</option>`;
        }).join("");
        if (state.episodes.length) await loadEpisode(state.episodes[0].video_id);
      }

      async function loadEpisode(videoId) {
        const episode = state.episodes.find((item) => item.video_id === videoId);
        if (!episode) return;
        state.currentEpisode = episode;
        state.selectedId = "";
        state.duration = 0;
        el.video.src = `/api/episodes/${videoId}/video`;
        const [algorithmOutput, feedback, subtitleText, danmakuPayload] = await Promise.all([
          fetchJson(`/api/episodes/${videoId}/algorithm-output`),
          fetchJson(`/api/episodes/${videoId}/feedback`),
          fetch(`/api/episodes/${videoId}/subtitle`).then((response) => response.ok ? response.text() : ""),
          fetchJson(`/api/episodes/${videoId}/danmaku`),
        ]);
        state.reviewItems = ReviewTool.normalizeAlgorithmOutput(algorithmOutput, videoId);
        state.reviews = ReviewTool.normalizeReviewMap(feedback);
        state.missedTriggers = ReviewTool.normalizeMissedTriggers(feedback);
        state.subtitles = parseSrt(subtitleText);
        state.danmaku = ReviewTool.extractDanmakuItems(danmakuPayload);
        state.selectedId = state.reviewItems[0] ? state.reviewItems[0].id : "";
        renderAll();
      }

      function parseSrt(text) {
        return String(text || "").split(/\n\s*\n/).map((block) => {
          const lines = block.trim().split(/\n/);
          const timeLine = lines.find((line) => line.includes("-->")) || "";
          const match = timeLine.match(/(\d+):(\d+):(\d+),(\d+)\s+-->\s+(\d+):(\d+):(\d+),(\d+)/);
          if (!match) return null;
          const start = Number(match[1]) * 3600 + Number(match[2]) * 60 + Number(match[3]) + Number(match[4]) / 1000;
          const end = Number(match[5]) * 3600 + Number(match[6]) * 60 + Number(match[7]) + Number(match[8]) / 1000;
          return { start, end, text: lines.slice(lines.indexOf(timeLine) + 1).join(" ") };
        }).filter(Boolean);
      }

      function renderAll() {
        renderProgress();
        renderTimeline();
        renderTriggerList();
        renderDetail();
        renderDanmaku();
        updateSubtitle();
      }

      function renderProgress() {
        const reviewed = Object.values(state.reviews).filter((review) => review && review.verdict).length;
        el.reviewProgress.textContent = `${reviewed}/${state.reviewItems.length} 已审核 · 漏检 ${state.missedTriggers.length}`;
      }

      function filteredItems() {
        const filter = el.filterSelect.value;
        if (filter === "pending") return state.reviewItems.filter((item) => !(state.reviews[item.id] && state.reviews[item.id].verdict));
        if (filter === "reviewed") return state.reviewItems.filter((item) => state.reviews[item.id] && state.reviews[item.id].verdict);
        return state.reviewItems;
      }

      function renderTriggerList() {
        const items = filteredItems();
        el.triggerList.innerHTML = items.map((item) => {
          const review = state.reviews[item.id] || {};
          const classes = ["trigger-item", item.id === state.selectedId ? "active" : "", review.verdict ? "reviewed" : ""].join(" ");
          return `<div class="${classes}" data-id="${item.id}">
            <div><span class="time">${ReviewTool.formatClock(item.cue_time)}</span> ${item.primary_expression || item.kind}</div>
            <div class="meta">${item.source_type} · ${item.interaction_mode} · ${review.verdict || "pending"}</div>
            <div>${escapeHtml(item.summary || item.reason || "无摘要")}</div>
          </div>`;
        }).join("") || '<div class="meta">没有可审阅的算法输出，可以直接新增漏检点。</div>';
      }

      function renderTimeline() {
        const width = Math.max(1, el.timeline.clientWidth);
        const duration = state.duration || el.video.duration || Math.max(...state.reviewItems.map((item) => item.end_time), ...state.missedTriggers.map((item) => item.cue_time), 1);
        el.timeline.querySelectorAll(".marker").forEach((node) => node.remove());
        for (const item of state.reviewItems) {
          const marker = document.createElement("div");
          marker.className = "marker";
          marker.title = `${ReviewTool.formatClock(item.cue_time)} ${item.primary_expression || item.kind}`;
          marker.style.left = `${Math.min(1, item.cue_time / duration) * width}px`;
          marker.dataset.id = item.id;
          el.timeline.appendChild(marker);
        }
        for (const item of state.missedTriggers) {
          const marker = document.createElement("div");
          marker.className = "marker missed";
          marker.title = `${ReviewTool.formatClock(item.cue_time)} 漏检: ${item.primary_expression}`;
          marker.style.left = `${Math.min(1, item.cue_time / duration) * width}px`;
          el.timeline.appendChild(marker);
        }
        updatePlayhead();
      }

      function renderDetail() {
        const item = state.reviewItems.find((candidate) => candidate.id === state.selectedId);
        if (!item) {
          el.detailPanel.innerHTML = `<h2>漏检点</h2>${renderMissedEditor()}`;
          bindDetailInputs();
          return;
        }
        const review = state.reviews[item.id] || {};
        el.detailPanel.innerHTML = `
          <h2>${escapeHtml(item.primary_expression || item.kind)}</h2>
          <div class="meta">${item.id} · ${item.kind}</div>
          <p><span class="time">${ReviewTool.formatClock(item.start_time)} - ${ReviewTool.formatClock(item.end_time)}</span></p>
          <p>${escapeHtml(item.summary || "无摘要")}</p>
          <p class="meta">${escapeHtml(item.reason || "")}</p>
          <div class="verdicts">
            ${verdictButton("correct", "准确", review)}
            ${verdictButton("false_positive", "不该触发", review)}
            ${verdictButton("timing_early", "偏早", review)}
            ${verdictButton("timing_late", "偏晚", review)}
            ${verdictButton("expression_wrong", "表达错", review)}
            ${verdictButton("interaction_wrong", "交互错", review)}
          </div>
          <div class="grid">
            <label>修正开始<input id="correctedStart" value="${escapeAttr(review.corrected_start_time ?? item.start_time)}"></label>
            <label>修正结束<input id="correctedEnd" value="${escapeAttr(review.corrected_end_time ?? item.end_time)}"></label>
            <label>修正表达<input id="correctedExpression" value="${escapeAttr(review.corrected_primary_expression || item.primary_expression)}"></label>
            <label>修正交互<select id="correctedMode">
              ${["single_tap", "hold_burst", "repeat_tap", "stance_poll", "finale_rating"].map((mode) => `<option value="${mode}" ${(review.corrected_interaction_mode || item.interaction_mode) === mode ? "selected" : ""}>${mode}</option>`).join("")}
            </select></label>
            <label class="full">备注<textarea id="reviewNote">${escapeHtml(review.note || "")}</textarea></label>
          </div>
        `;
        bindDetailInputs();
      }

      function verdictButton(value, label, review) {
        const className = `${value === "correct" ? "good" : "bad"} ${review.verdict === value ? "active" : ""}`;
        return `<button class="${className}" data-verdict="${value}">${label}</button>`;
      }

      function renderMissedEditor() {
        return `
          <div class="meta">在当前播放时间新增算法漏检点。</div>
          <div class="grid">
            <label>cue_time<input id="missedCue" value="${ReviewTool.roundTime(el.video.currentTime || 0)}"></label>
            <label>source_type<select id="missedSource"><option>plot</option><option>performance</option><option>character_appeal</option><option>finale_judgment</option></select></label>
            <label>primary_expression<input id="missedExpression" placeholder="爽到了 / 震惊 / 笑死"></label>
            <label>interaction_mode<select id="missedMode"><option>single_tap</option><option>hold_burst</option><option>repeat_tap</option><option>stance_poll</option><option>finale_rating</option></select></label>
            <label class="full">原因<textarea id="missedNote" placeholder="为什么这里适合低摩擦表达"></textarea></label>
          </div>
          <p><button class="primary" id="confirmMissed">确认新增漏检</button></p>
          <h2>已新增漏检</h2>
          ${state.missedTriggers.map((item, index) => `<div class="trigger-item"><span class="time">${ReviewTool.formatClock(item.cue_time)}</span> ${escapeHtml(item.primary_expression || "未填写")}<div class="meta">${escapeHtml(item.note || "")}</div><button data-remove-missed="${index}">删除</button></div>`).join("")}
        `;
      }

      function bindDetailInputs() {
        el.detailPanel.querySelectorAll("[data-verdict]").forEach((button) => {
          button.addEventListener("click", () => {
            const review = ensureReview(state.selectedId);
            review.verdict = button.dataset.verdict;
            syncReviewForm(review);
            markDirty();
            renderAll();
          });
        });
        ["correctedStart", "correctedEnd", "correctedExpression", "correctedMode", "reviewNote"].forEach((id) => {
          const input = document.getElementById(id);
          if (!input || !state.selectedId) return;
          input.addEventListener("input", () => {
            const review = ensureReview(state.selectedId);
            syncReviewForm(review);
            markDirty();
            renderProgress();
          });
        });
        const confirmMissed = document.getElementById("confirmMissed");
        if (confirmMissed) {
          confirmMissed.addEventListener("click", () => {
            state.missedTriggers.push({
              cue_time: document.getElementById("missedCue").value,
              source_type: document.getElementById("missedSource").value,
              primary_expression: document.getElementById("missedExpression").value,
              interaction_mode: document.getElementById("missedMode").value,
              note: document.getElementById("missedNote").value,
            });
            markDirty();
            renderAll();
          });
        }
        el.detailPanel.querySelectorAll("[data-remove-missed]").forEach((button) => {
          button.addEventListener("click", () => {
            state.missedTriggers.splice(Number(button.dataset.removeMissed), 1);
            markDirty();
            renderAll();
          });
        });
      }

      function ensureReview(triggerId) {
        if (!state.reviews[triggerId]) state.reviews[triggerId] = {};
        return state.reviews[triggerId];
      }

      function syncReviewForm(review) {
        const start = document.getElementById("correctedStart");
        const end = document.getElementById("correctedEnd");
        const expression = document.getElementById("correctedExpression");
        const mode = document.getElementById("correctedMode");
        const note = document.getElementById("reviewNote");
        if (start) review.corrected_start_time = start.value;
        if (end) review.corrected_end_time = end.value;
        if (expression) review.corrected_primary_expression = expression.value;
        if (mode) review.corrected_interaction_mode = mode.value;
        if (note) review.note = note.value;
      }

      function renderDanmaku() {
        const current = el.video.currentTime || 0;
        const nearby = state.danmaku.filter((item) => Math.abs(item.time_sec - current) <= 8).slice(0, 80);
        el.danmakuCount.textContent = String(state.danmaku.length);
        el.danmakuList.innerHTML = nearby.map((item) => `<div class="danmaku-row ${Math.abs(item.time_sec - current) <= 2 ? "near" : ""}"><span class="time">${ReviewTool.formatClock(item.time_sec)}</span> ${escapeHtml(item.text)}</div>`).join("") || '<div class="meta">当前附近没有弹幕</div>';
      }

      function updateSubtitle() {
        const current = el.video.currentTime || 0;
        const active = state.subtitles.find((item) => item.start <= current && current <= item.end);
        el.subtitleLine.textContent = active ? active.text : " ";
      }

      function updatePlayhead() {
        const duration = state.duration || el.video.duration || 1;
        el.playhead.style.left = `${Math.min(1, (el.video.currentTime || 0) / duration) * 100}%`;
      }

      function jumpToItem(item) {
        if (!item) return;
        state.selectedId = item.id;
        el.video.currentTime = Math.max(0, item.cue_time - 1);
        renderAll();
      }

      function selectedIndex() {
        return state.reviewItems.findIndex((item) => item.id === state.selectedId);
      }

      function markDirty() {
        el.saveStatus.textContent = "有未保存修改";
      }

      async function saveFeedback() {
        if (!state.currentEpisode) return;
        const payload = ReviewTool.buildFeedbackPayload({
          videoId: state.currentEpisode.video_id,
          datasetEpisodeDir: state.currentEpisode.episode_dir,
          algorithmOutputPath: state.currentEpisode.algorithm_output_path,
          reviews: state.reviews,
          missedTriggers: state.missedTriggers,
          episodeReview: { status: "in_progress", note: "" },
        });
        const response = await fetch(`/api/episodes/${state.currentEpisode.video_id}/feedback`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const result = await response.json();
        el.saveStatus.textContent = result.ok ? `已保存 ${new Date().toLocaleTimeString()}` : `保存失败: ${result.error}`;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
      }

      function escapeAttr(value) {
        return escapeHtml(value);
      }

      el.episodeSelect.addEventListener("change", () => loadEpisode(el.episodeSelect.value));
      el.filterSelect.addEventListener("change", renderTriggerList);
      el.triggerList.addEventListener("click", (event) => {
        const itemNode = event.target.closest("[data-id]");
        if (!itemNode) return;
        const item = state.reviewItems.find((candidate) => candidate.id === itemNode.dataset.id);
        jumpToItem(item);
      });
      el.timeline.addEventListener("click", (event) => {
        const marker = event.target.closest("[data-id]");
        if (marker) jumpToItem(state.reviewItems.find((item) => item.id === marker.dataset.id));
      });
      el.prevTrigger.addEventListener("click", () => jumpToItem(state.reviewItems[Math.max(0, selectedIndex() - 1)]));
      el.nextTrigger.addEventListener("click", () => jumpToItem(state.reviewItems[Math.min(state.reviewItems.length - 1, selectedIndex() + 1)]));
      el.addMissed.addEventListener("click", () => {
        state.selectedId = "";
        renderDetail();
      });
      el.saveFeedback.addEventListener("click", saveFeedback);
      el.video.addEventListener("loadedmetadata", () => {
        state.duration = el.video.duration || 0;
        renderTimeline();
      });
      el.video.addEventListener("timeupdate", () => {
        updateSubtitle();
        updatePlayhead();
        renderDanmaku();
      });
      window.addEventListener("resize", renderTimeline);

      loadEpisodes().catch((error) => {
        el.subtitleLine.textContent = `加载失败: ${error.message}`;
      });
    </script>
  </body>
</html>
